name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: ShellCheck
        run: shellcheck bin/launchpad

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: uv run pytest
      - name: Smoke test
        run: |
          sh bin/launchpad --version | grep -x 'launchpad [0-9.]*'
          sh bin/launchpad --help

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse the TOML
        run: |
          python - <<'PY'
          import tomllib
          for path in ("herdr-plugin.toml", "examples/config.toml", "pyproject.toml"):
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("ok", path)
          PY
      - name: Check the manifest and example config
        run: |
          pip install pytest
          python -m pytest tests/test_manifest.py tests/test_config.py::test_example_config_parses

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
